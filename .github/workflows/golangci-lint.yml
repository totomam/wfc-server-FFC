name: golangci-lint
on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # 'stable' (newest Go) crashed golangci-lint v2.11 in go/types (s94)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
